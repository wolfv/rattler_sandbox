[package]
name = "rattler_sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A cross-platform sandbox for executing untrusted commands, derived from OpenAI Codex"
repository = "https://github.com/conda/rattler"
readme = "README.md"

[lib]
name = "rattler_sandbox"
path = "src/lib.rs"

[[bin]]
name = "rattler-sandbox"
path = "src/main.rs"

[[bin]]
name = "rattler-windows-sandbox-setup"
path = "src/bin/windows_setup.rs"

[[bin]]
name = "rattler-command-runner"
path = "src/bin/windows_runner.rs"

[dependencies]
dunce = "1"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
url = "2"
which = "8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
glob = "0.3"
anyhow = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
portable-pty = "0.9"
log = "0.4"
lazy_static = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
filedescriptor = "0.8"
shared_library = "0.1"
winapi = { version = "0.3", features = [
    "handleapi",
    "minwinbase",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs-next = "2"
glob = "0.3"
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
tempfile = "3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_AppLocker",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"

[features]
default = []
