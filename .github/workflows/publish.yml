name: publish-conda

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-conda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-64 }
          - { os: macos-14,       target: osx-arm64 }
          - { os: windows-latest, target: win-64 }
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: latest
          cache: true

      - name: Install rattler-build
        shell: bash
        run: pixi global install rattler-build

      - name: Build conda package
        shell: bash
        run: |
          rattler-build build \
            --recipe recipe/recipe.yaml \
            --output-dir ./output

      - name: Upload to prefix.dev (trusted publishing)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          rattler-build upload prefix \
            --channel wolfv \
            ./output/${{ matrix.target }}/*.conda

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.target }}
          path: ./output/${{ matrix.target }}/*.conda
          if-no-files-found: error
